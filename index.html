<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portsmouth · Community Wellness Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="./styles.css" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- ── Sidebar ── -->
    <aside id="panel">
      <header class="brand">
        <div class="kicker">City of Portsmouth, VA</div>
        <h1>Community Wellness Index</h1>
        <p class="sub">How wellbeing varies across the city's neighborhoods, by domain.</p>
      </header>

      <section class="control">
        <label for="metric">Show</label>
        <select id="metric"></select>
      </section>

      <section class="legend">
        <div class="legend-title"><span id="legend-name">Overall CWI</span> · 5 classes (quantile)</div>
        <div id="legend-scale"></div>
        <div class="legend-ends"><span>lower</span><span>higher wellbeing</span></div>
      </section>

      <!-- Tract detail (report card) -->
      <section id="detail" class="detail hidden">
        <div class="detail-head">
          <div>
            <div class="kicker">Census Tract</div>
            <h2 id="d-name">—</h2>
          </div>
          <div class="d-score"><span id="d-cwi">—</span><small>CWI</small></div>
        </div>
        <div class="domains" id="d-domains"></div>
        <div class="d-foot" id="d-foot"></div>
      </section>

      <footer class="foot">
        <div id="stat" class="stat"></div>
        <div class="note">Tract level · eight weighted domains · <span id="src">Census and city GIS</span>.
          Indicative; methodology under review.</div>
      </footer>
    </aside>

    <!-- ── Map ── -->
    <main id="map"></main>
    <div id="tooltip" class="tooltip hidden"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="./app.js"></script>
</body>
</html>
